name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Hong_Kong

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate route types and typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: npm run dev > /tmp/approval-app.log 2>&1 &
        env:
          E2E_AUTH_BYPASS_EMAIL: workflow-ci@example.com

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/approval-app.log
          exit 1

      - name: Run browser acceptance tests
        run: npm run e2e:regression
        env:
          APP_URL: http://localhost:3000
          E2E_AUTH_BYPASS_EMAIL: workflow-ci@example.com
          E2E_BROWSER_CHANNEL: chromium

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: approval-app-server-log
          path: /tmp/approval-app.log
          if-no-files-found: ignore
